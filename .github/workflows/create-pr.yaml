name: 'PR - From Dev to Master'

on:
  push:
    branches:
    - dev  # Support wildcard matching
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  pull-request:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: ensure labels
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
      run: |
        ensure_label() {
          local name="$1"
          local color="$2"
          local description="$3"

          if gh label list --repo "$REPO" --limit 200 --json name --jq '.[].name' | grep -Fxq "$name"; then
            echo "Label already exists: $name"
            return 0
          fi

          gh label create "$name" \
            --repo "$REPO" \
            --color "$color" \
            --description "$description"
        }

        ensure_label "auto-pr" "1d76db" "Automatically created pull requests"
        ensure_label "staging" "fbca04" "Changes promoted from dev toward master"
    - name: detect promotable changes
      id: diff
      run: |
        git fetch origin dev master
        ahead_count="$(git cherry origin/master origin/dev | grep -c '^+' || true)"

        if [ "$ahead_count" -gt 0 ]; then
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "Found $ahead_count dev patch(es) not yet in master."
        else
          echo "has_changes=false" >> "$GITHUB_OUTPUT"
          echo "No changes to promote from dev to master."
        fi
    - name: pull-request
      if: steps.diff.outputs.has_changes == 'true'
      uses: repo-sync/pull-request@v2
      with:
        source_branch: "dev"                              # Scheduled runs must always promote dev -> master
        destination_branch: "master"                      # If blank, default: master
        pr_title: "Pulling refs/heads/dev into master"    # Title of pull request
        pr_body: ":crown:* An automated PR*    \n These are the updates and changes to the development branch"              # Full markdown support, requires pr_title to be set
        pr_label: "auto-pr,staging"                                # Comma-separated list (no spaces)
        pr_allow_empty: true                              # Creates pull request even if there are no changes
        github_token: ${{ secrets.GITHUB_TOKEN }}
    - name: request review
      if: steps.diff.outputs.has_changes == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        BRANCH_NAME: dev
      run: |
        gh pr edit "$BRANCH_NAME" \
          --repo "$REPO" \
          --add-reviewer "Esturban" \
          --add-assignee "Esturban" \
          --add-label "auto-pr,staging"
